<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitBay - Home</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Include Bootstrap (if carousel is used) -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <header class="header">
        <div class="container d-flex justify-content-between align-items-center py-3">
            <div class="logo-nav d-flex align-items-center">
                <h1 class="logo"><a href="index.html" class="text-dark text-decoration-none">BitBay</a></h1>
                <nav class="ml-4">
                    <a href="index.html" class="nav-link d-inline-block">Home</a>
                    <a href="auction.html" class="nav-link d-inline-block">View Auctions</a>
                </nav>
            </div>
            <div class="search-bar d-flex">
                <input type="text" class="form-control" placeholder="Search auctions...">
                <button class="btn btn-primary ml-2">Search</button>
            </div>
        </div>
    </header>

    <div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/watch.jpg" class="d-block w-100" alt="Antique gold watch">
            </div>
            <div class="carousel-item">
                <img src="images/vase.jpg" class="d-block w-100" alt="Antique vase">
            </div>
            <div class="carousel-item">
                <img src="images/painting.jpg" class="d-block w-100" alt="Rare painting">
            </div>
        </div>
        <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
        </a>
    </div>

    <main class="container my-5">
        <section>
            <h2 class="mb-4">Featured Auctions</h2>
            <div class="row">
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <img src="images/vase.jpg" class="card-img-top" alt="Antique Vase">
                        <div class="card-body">
                            <p class="card-text">Antique Vase - Starting Bid: 1 ETH</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <img src="images/watch.jpg" class="card-img-top" alt="Vintage Watch">
                        <div class="card-body">
                            <p class="card-text">Vintage Watch - Starting Bid: 2 ETH</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card">
                        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Rare Painting">
                        <div class="card-body">
                            <p class="card-text">Rare Painting - Starting Bid: 3 ETH</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2025 BitBay. All rights reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
