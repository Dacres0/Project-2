<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ByBit - Payment</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
</head>
<body class="text-dark bg-white">
  <!-- Header -->
  <header class="bg-light text-dark py-4 border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">BitBay</h1>
      <nav>
        <a href="index.html" class="nav-link text-dark d-inline-block px-3">Home</a>
        <a href="auction.html" class="nav-link text-dark d-inline-block px-3">Auctions</a>
        <a href="payment.html" class="nav-link text-dark d-inline-block px-3">Payment</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container my-5 text-dark">
    <div class="card p-4 shadow-lg">
      <h2 class="mb-4">Confirm Your Bid</h2>
      <p><strong>Item:</strong> <span id="itemName">Loading...</span></p>
      <p><strong>Description:</strong> <span id="itemDescription">Loading...</span></p>
      <p><strong>Starting Bid:</strong> <span id="startingBid">Loading...</span></p>

      <hr/>

      <!-- Payment Method -->
      <div class="form-group">
        <label for="paymentMethod">Choose Payment Method:</label>
        <select id="paymentMethod" class="form-control">
          <option value="eth">Ethereum</option>
          <option value="card">Debit/Credit Card</option>
        </select>
      </div>

      <!-- ETH Payment Form -->
      <form id="ethForm" class="mt-4">
        <div class="form-group">
          <label for="ethAddress">Your Ethereum Wallet Address</label>
          <input type="text" id="ethAddress" class="form-control" placeholder="0x..." required />
        </div>
        <div class="form-group">
          <label for="ethBid">Your Bid (ETH)</label>
          <input type="number" step="0.01" min="0" id="ethBid" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-success w-100">Submit ETH Bid</button>
      </form>

      <!-- Card Payment Form -->
      <form id="cardForm" class="mt-4 d-none">
        <div class="form-group">
          <label for="cardName">Name on Card</label>
          <input type="text" id="cardName" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" class="form-control" placeholder="1234 5678 9012 3456" required />
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="expiry">Expiry</label>
            <input type="text" id="expiry" class="form-control" placeholder="MM/YY" required />
          </div>
          <div class="form-group col-md-6">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" class="form-control" placeholder="123" required />
          </div>
        </div>
        <div class="form-group">
          <label for="cardBid">Your Bid (ETH)</label>
          <input type="number" step="0.01" min="0" id="cardBid" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Submit Card Bid</button>
      </form>

      <!-- Confirmation Message -->
      <div id="confirmation" class="alert alert-success mt-4 d-none text-dark"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-light text-center py-3 text-dark border-top">
    <p class="mb-0">&copy; 2025 Auction House. All rights reserved.</p>
  </footer>

  <!-- Script -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const item = params.get("item");
    const bid = params.get("bid");
    const description = params.get("desc") || "No description provided.";

    document.getElementById("itemName").textContent = item ? decodeURIComponent(item) : "Unknown Item";
    document.getElementById("startingBid").textContent = bid ? `${bid} ETH` : "Unknown";
    document.getElementById("itemDescription").textContent = decodeURIComponent(description);
    document.getElementById("ethBid").value = bid;
    document.getElementById("cardBid").value = bid;

    document.getElementById("paymentMethod").addEventListener("change", function () {
      const method = this.value;
      document.getElementById("ethForm").classList.toggle("d-none", method !== "eth");
      document.getElementById("cardForm").classList.toggle("d-none", method !== "card");
    });

    document.getElementById("ethForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const address = document.getElementById("ethAddress").value;
      const amount = document.getElementById("ethBid").value;
      showConfirmation(item, amount, `ETH Wallet: ${address}`);
    });

    document.getElementById("cardForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const name = document.getElementById("cardName").value;
      const amount = document.getElementById("cardBid").value;
      showConfirmation(item, amount, `Cardholder: ${name}`);
    });

    function showConfirmation(itemName, bidAmount, paymentInfo) {
      const confirmation = document.getElementById("confirmation");
      confirmation.classList.remove("d-none");
      confirmation.innerHTML = `
        <strong>Bid Submitted!</strong><br>
        <strong>Item:</strong> ${decodeURIComponent(itemName)}<br>
        <strong>Bid:</strong> ${bidAmount} ETH<br>
        <strong>Payment Info:</strong> ${paymentInfo}
      `;
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
