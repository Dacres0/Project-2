<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BitBay - Payment</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/web3/dist/web3.min.js"></script>
</head>
<body>

  <!-- Header -->
  <header class="header bg-dark text-white py-4">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="logo">
        <h1 class="h4 mb-0">
          <a href="index.html" class="text-white text-decoration-none">BitBay</a>
        </h1>
      </div>
      <nav>
        <a href="index.html" class="nav-link text-white d-inline-block px-3">Home</a>
        <a href="auction.html" class="nav-link text-white d-inline-block px-3">Auctions</a>
        <a href="payment.html" class="nav-link text-white d-inline-block px-3">Payment</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container my-5">
    <h2 class="mb-4">Complete Your Payment</h2>

    <form id="paymentForm" class="border p-4 rounded shadow-sm bg-white">
      <div class="form-group">
        <label for="amount">Amount (ETH)</label>
        <input type="number" id="amount" name="amount" class="form-control" step="0.01" min="0.01" required>
      </div>

      <div class="form-group">
        <label for="paymentMethod">Choose Payment Method</label>
        <select id="paymentMethod" name="paymentMethod" class="form-control" required>
          <option value="">-- Select --</option>
          <option value="ethereum">Ethereum</option>
          <option value="debit">Debit Card</option>
        </select>
      </div>

      <!-- Ethereum Payment -->
      <div id="ethereumPayment" class="mt-3" style="display: none;">
        <button type="button" class="btn btn-outline-success" onclick="makeEthereumPayment()">Pay with Ethereum</button>
      </div>

      <!-- Debit Card Payment -->
      <div id="debitPayment" style="display: none;">
        <div class="form-group mt-3">
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" class="form-control" maxlength="19" placeholder="1234 5678 9012 3456" required>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="expiryDate">Expiry Date</label>
            <input type="month" id="expiryDate" name="expiryDate" class="form-control" required>
          </div>
          <div class="form-group col-md-6">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" class="form-control" maxlength="4" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Pay with Debit Card</button>
      </div>
    </form>
  </main>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">&copy; 2025 BitBay. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script>
    const paymentMethod = document.getElementById('paymentMethod');
    const ethereumPayment = document.getElementById('ethereumPayment');
    const debitPayment = document.getElementById('debitPayment');

    paymentMethod.addEventListener('change', () => {
      ethereumPayment.style.display = paymentMethod.value === 'ethereum' ? 'block' : 'none';
      debitPayment.style.display = paymentMethod.value === 'debit' ? 'block' : 'none';
    });

    async function makeEthereumPayment() {
      const amount = document.getElementById('amount').value;
      if (!amount || amount <= 0) {
        alert('Please enter a valid amount.');
        return;
      }

      if (typeof window.ethereum !== 'undefined') {
        const web3 = new Web3(window.ethereum);
        try {
          await window.ethereum.request({ method: 'eth_requestAccounts' });
          const accounts = await web3.eth.getAccounts();
          const recipient = '0xYourEthereumAddressHere'; // Replace this with a real address

          await web3.eth.sendTransaction({
            from: accounts[0],
            to: recipient,
            value: web3.utils.toWei(amount, 'ether')
          });

          alert('Payment successful!');
        } catch (error) {
          console.error(error);
          alert('Payment failed. Check the console for details.');
        }
      } else {
        alert('MetaMask or another Ethereum wallet is required.');
      }
    }

    // Optional: prevent default form submission for demo
    document.getElementById('paymentForm').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('Debit card payment processed (simulated).');
    });
  </script>

</body>
</html>
