<!-- payment.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ByBit - Payment</title>
  <link rel="stylesheet" href="styles.css"/>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
</head>
<body>
  <header class="bg-dark text-white py-4">
    <div class="container">
      <h1 class="h4">Confirm Your Bid</h1>
    </div>
  </header>

  <main class="container my-5">
    <div class="card p-4 shadow-lg">
      <h2 class="mb-4">Bid Details</h2>
      <p><strong>Item:</strong> <span id="itemName">Loading...</span></p>
      <p><strong>Your Bid:</strong> <span id="itemBid">Loading...</span></p>

      <hr />

      <form>
        <div class="form-group">
          <label for="ethAddress">Your Ethereum Wallet Address</label>
          <input type="text" id="ethAddress" class="form-control" placeholder="0x..." required>
        </div>
        <div class="form-group">
          <label for="confirmBid">Confirm Amount (ETH)</label>
          <input type="number" id="confirmBid" class="form-control" placeholder="Amount" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Submit Payment</button>
      </form>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">&copy; 2025 Auction House. All rights reserved.</p>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const item = params.get("item");
    const bid = params.get("bid");

    if (item && bid) {
      document.getElementById("itemName").textContent = decodeURIComponent(item);
      document.getElementById("itemBid").textContent = `${bid} ETH`;
      document.getElementById("confirmBid").value = bid;
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
